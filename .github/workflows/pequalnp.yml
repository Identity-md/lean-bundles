# Builds and publishes the prebuilt Lean files IMD's pequalnp.com desk runs on (scripts/pequalnp.sh), for one commit of
# open-goat/pequalnp-proofs (brilliant-hq/pequalnp-proofs until 2026-11-22), and publishes them only once each holds to
# the IMD worker's reader, rule by rule (scripts/check-bundle.py). Run by hand:
# gh workflow run pequalnp.yml -f ref=<commit, branch or tag>.
name: pequalnp bundle

on:
  workflow_dispatch:
    inputs:
      ref:
        description: open-goat/pequalnp-proofs commit, branch or tag to build
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: pequalnp-bundle
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: bundles
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: open-goat/pequalnp-proofs
          ref: ${{ inputs.ref }}
          path: project
          persist-credentials: false
      - name: Make room
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get install -y -qq time zstd >/dev/null
          df -h /
      - name: Build, pack and check
        id: bundle
        run: bash bundles/scripts/pequalnp.sh "$GITHUB_WORKSPACE/project" "$RUNNER_TEMP/out"
      # What a machine's reader refuses, before an item starts (2026-11-25: a ./ member failed every item): a bundle it
      # would refuse is not published.
      - name: Hold every bundle to the IMD worker's reader
        env:
          LEAN_ASSET: ${{ steps.bundle.outputs.lean_asset }}
          PACKAGES_ASSET: ${{ steps.bundle.outputs.packages_asset }}
          PROJECT_ASSET: ${{ steps.bundle.outputs.project_asset }}
        run: |
          cd "$RUNNER_TEMP/out"
          for asset in "$LEAN_ASSET" "$PACKAGES_ASSET" "$PROJECT_ASSET"; do
            echo "$asset"
            zstd -dc "$asset" | python3 -I "$GITHUB_WORKSPACE/bundles/scripts/check-bundle.py" "$(stat -c %s "$asset")"
          done
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ steps.bundle.outputs.release }}
          LEAN_ASSET: ${{ steps.bundle.outputs.lean_asset }}
          PACKAGES_ASSET: ${{ steps.bundle.outputs.packages_asset }}
          PROJECT_ASSET: ${{ steps.bundle.outputs.project_asset }}
        run: |
          cd "$RUNNER_TEMP/out"
          if gh release view "$RELEASE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::$RELEASE is already published; a release is never replaced"
            exit 1
          fi
          # GitHub answered HTTP 500 to a release's creation once (run 45646758688, 2026-11-25): asked again twice, and
          # never over a release that was made in part, which is looked at by hand rather than replaced.
          for attempt in 1 2 3; do
            if gh release create "$RELEASE" --repo "$GITHUB_REPOSITORY" --title "$RELEASE" --notes-file notes.md \
              "$LEAN_ASSET" "$PACKAGES_ASSET" "$PROJECT_ASSET" fetch.json setup.txt; then
              exit 0
            fi
            sleep 30
            if gh release view "$RELEASE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "::error::$RELEASE was made in part; look at it before running this again"
              exit 1
            fi
          done
          exit 1
