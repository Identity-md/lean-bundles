# Builds and publishes the prebuilt Lean files IMD's pequalnp.com desk runs on (scripts/pequalnp.sh), for one commit of
# open-goat/pequalnp-proofs (brilliant-hq/pequalnp-proofs until 2026-11-22), and publishes them only once each holds to
# the IMD worker's reader, rule by rule (scripts/check-bundle.py). Run by hand, once a chip:
# gh workflow run pequalnp.yml -f ref=<commit, branch or tag> [-f platform=linux-arm64].
name: pequalnp bundle

on:
  workflow_dispatch:
    inputs:
      ref:
        description: open-goat/pequalnp-proofs commit, branch or tag to build
        required: true
        default: main
      platform:
        description: the chip the files are built for, on GitHub's runner of that chip
        type: choice
        options: [linux-x64, linux-arm64]
        default: linux-x64

permissions:
  contents: read

concurrency:
  group: pequalnp-bundle-${{ inputs.platform }}
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ${{ inputs.platform == 'linux-arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 150
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: bundles
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: open-goat/pequalnp-proofs
          ref: ${{ inputs.ref }}
          path: project
          persist-credentials: false
      - name: Make room
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get install -y -qq time zstd >/dev/null
          df -h /
      - name: Build, pack and check
        id: bundle
        run: bash bundles/scripts/pequalnp.sh "$GITHUB_WORKSPACE/project" "$RUNNER_TEMP/out"
      # What a machine's reader refuses, before an item starts (2026-11-25: a ./ member failed every item): a bundle it
      # would refuse is not published.
      - name: Hold every bundle to the IMD worker's reader
        env:
          LEAN_ASSET: ${{ steps.bundle.outputs.lean_asset }}
          PACKAGES_ASSET: ${{ steps.bundle.outputs.packages_asset }}
          PROJECT_ASSET: ${{ steps.bundle.outputs.project_asset }}
        run: |
          cd "$RUNNER_TEMP/out"
          for asset in "$LEAN_ASSET" "$PACKAGES_ASSET" "$PROJECT_ASSET"; do
            echo "$asset"
            zstd -dc "$asset" | python3 -I "$GITHUB_WORKSPACE/bundles/scripts/check-bundle.py" "$(stat -c %s "$asset")"
          done
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ steps.bundle.outputs.release }}
          LEAN_ASSET: ${{ steps.bundle.outputs.lean_asset }}
          PACKAGES_ASSET: ${{ steps.bundle.outputs.packages_asset }}
          PROJECT_ASSET: ${{ steps.bundle.outputs.project_asset }}
          PLATFORM: ${{ steps.bundle.outputs.platform }}
        # A draft first, each file uploaded on its own and asked again on GitHub's failures, every size checked, and only
        # then published: GitHub answered HTTP 500 to a release's creation and to a 1.8 GB upload during its incident of
        # 2026-11-25, and gh left a draft holding four of the five files. A draft an earlier run left for the same commit
        # is finished, its files replaced by this run's; a published release is never replaced.
        run: |
          cd "$RUNNER_TEMP/out"
          retry() {
            for attempt in 1 2 3 4 5; do
              "$@" && return 0
              echo "attempt $attempt failed; asking again in $((attempt * 60)) s"
              sleep $((attempt * 60))
            done
            return 1
          }
          files=(fetch.json setup.txt "$LEAN_ASSET" "$PROJECT_ASSET" "$PACKAGES_ASSET")
          if state=$(gh release view "$RELEASE" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$state" != true ]; then
              echo "::error::$RELEASE is already published; a release is never replaced"
              exit 1
            fi
            echo "$RELEASE is a draft an earlier run left: this run's files replace its own"
            retry gh release edit "$RELEASE" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
          else
            retry gh release create "$RELEASE" --repo "$GITHUB_REPOSITORY" --draft --title "$RELEASE" --notes-file notes.md
          fi
          for file in "${files[@]}"; do
            retry gh release upload "$RELEASE" "$file" --repo "$GITHUB_REPOSITORY" --clobber
          done
          for file in "${files[@]}"; do
            want=$(stat -c %s "$file")
            got=$(retry gh release view "$RELEASE" --repo "$GITHUB_REPOSITORY" --json assets --jq ".assets[] | select(.name == \"$file\") | .size")
            if [ "$got" != "$want" ]; then
              echo "::error::$file is $got bytes on the draft, not $want; it stays a draft"
              exit 1
            fi
          done
          # Latest stays the linux-x64 release, which a desk's `fetch` names; another chip's sits beside it.
          if [ "$PLATFORM" = linux-x64 ]; then latest=--latest; else latest=--latest=false; fi
          retry gh release edit "$RELEASE" --repo "$GITHUB_REPOSITORY" --draft=false "$latest"
