# Builds and publishes the prebuilt Lean files IMD's pequalnp.com desk runs on (scripts/pequalnp.sh), for one commit of
# open-goat/pequalnp-proofs (brilliant-hq/pequalnp-proofs until 2026-11-22), and publishes them only once the released
# IMD worker's own reader has unpacked every one (scripts/worker-unpack.mjs). Run by hand:
# gh workflow run pequalnp.yml -f ref=<commit, branch or tag>.
name: pequalnp bundle

on:
  workflow_dispatch:
    inputs:
      ref:
        description: open-goat/pequalnp-proofs commit, branch or tag to build
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: pequalnp-bundle
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: bundles
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: open-goat/pequalnp-proofs
          ref: ${{ inputs.ref }}
          path: project
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Make room
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get install -y -qq time zstd >/dev/null
          df -h /
      - name: Build, pack and check
        id: bundle
        run: bash bundles/scripts/pequalnp.sh "$GITHUB_WORKSPACE/project" "$RUNNER_TEMP/out"
      # What a machine does before an item starts, with the newest released worker: a bundle it refuses is not published.
      - name: Unpack every bundle with the released IMD worker's own reader
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo rm -rf "$RUNNER_TEMP/check" "$RUNNER_TEMP/in-place" "$RUNNER_TEMP/toolchain" "$RUNNER_TEMP/toolchain.moved" \
            "$GITHUB_WORKSPACE/project" "$GITHUB_WORKSPACE/project.moved"
          df -h /
          mkdir -p "$RUNNER_TEMP/worker" && cd "$RUNNER_TEMP/worker"
          gh release download --repo Identity-md/worker --pattern identitymd-worker.tgz --pattern SHA256SUMS
          grep ' identitymd-worker.tgz$' SHA256SUMS | sha256sum -c -
          npm install --global --no-fund --no-audit ./identitymd-worker.tgz
          imd --version || true
          node "$GITHUB_WORKSPACE/bundles/scripts/worker-unpack.mjs" "$(npm root --global)/@identitymd/worker" "$RUNNER_TEMP/out" "$RUNNER_TEMP/worker-home"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ steps.bundle.outputs.release }}
          LEAN_ASSET: ${{ steps.bundle.outputs.lean_asset }}
          PACKAGES_ASSET: ${{ steps.bundle.outputs.packages_asset }}
          PROJECT_ASSET: ${{ steps.bundle.outputs.project_asset }}
        run: |
          cd "$RUNNER_TEMP/out"
          if gh release view "$RELEASE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::$RELEASE is already published; a release is never replaced"
            exit 1
          fi
          gh release create "$RELEASE" --repo "$GITHUB_REPOSITORY" --title "$RELEASE" --notes-file notes.md \
            "$LEAN_ASSET" "$PACKAGES_ASSET" "$PROJECT_ASSET" fetch.json setup.txt
